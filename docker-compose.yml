services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wayleave
    restart: unless-stopped
    ports:
      - '7070:3000'
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://localhost:3000',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
